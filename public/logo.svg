<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="50%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  
  <!-- Gradient ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#ring)" stroke-width="8"/>
  
  <!-- Bull & Bear emoji -->
  <text x="115" y="230" font-size="120" text-anchor="middle">🐂</text>
  <text x="285" y="230" font-size="120" text-anchor="middle">🐻</text>
  
  <!-- VS divider -->
  <line x1="200" y1="100" x2="200" y2="300" stroke="#333" stroke-width="2" stroke-dasharray="8,8"/>
</svg>
